name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # matplotlib is needed only by the rendering smoke test. CI never
      # checks what a figure looks like; rendered bytes move with the
      # library version, so the trajectory arrays and the metric values
      # are what get asserted.
      - run: pip install pytest matplotlib
      - run: python -m pytest -q
      # Every property a scenario carries is re-checked here against the
      # committed code, so a scenario cannot assert a fact that stopped
      # being true when the geometry changed underneath it.
      - name: Scenario properties hold
        run: python tools/verify_scenarios.py scenarios tests/fixtures
      - name: Suite inventory is reproducible
        run: python tools/report_suite.py tests/fixtures
      # The README and the status file both quote the suite size; this
      # fails the build when the suite grows or shrinks until every
      # documented number is updated, so no copy of the integer can
      # silently drift.
      - name: Test count matches README and STATUS
        run: |
          count=$(python -m pytest --collect-only -q | grep -oE '^[0-9]+ tests collected' | grep -oE '[0-9]+')
          echo "collected: ${count}"
          grep -q "${count} tests" README.md || { echo "README does not say '${count} tests'"; exit 1; }
          grep -q "${count}-test" paper/STATUS.md || { echo "STATUS.md does not say '${count}-test'"; exit 1; }
